<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Neon Racers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }
    
    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 14px 16px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 0 0 12px rgba(0,255,255,0.45);
      font-size: 14px;
      font-weight: 600;
    }
    #ui .center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 13px;
      opacity: 0.9;
    }
    
    #levelup {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 800;
      color: #00f2fe;
      text-shadow: 0 0 20px #00f2fe;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    
    #start, #over {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #0d0d1f 0%, #050508 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }
    
    h1 {
      font-size: 34px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    
    .sub { opacity: 0.6; font-size: 13px; margin-bottom: 24px; }
    
    .btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      color: white;
      padding: 13px 38px;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 0 22px rgba(0,150,255,0.45);
      pointer-events: auto;
      transition: transform 0.12s;
    }
    .btn:active { transform: scale(0.95); }
    
    .info {
      max-width: 280px;
      font-size: 13px;
      line-height: 1.55;
      opacity: 0.75;
      margin-top: 18px;
    }
    
    .score-big {
      font-size: 40px;
      font-weight: 800;
      margin: 10px 0 4px;
      color: #00f2fe;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  
  <div id="ui">
    <div>SCORE <span id="score">0</span></div>
    <div class="center">LEVEL <span id="level">1</span>/10</div>
    <div>BEST <span id="best">0</span></div>
  </div>
  
  <div id="levelup">LEVEL UP</div>
  
  <div id="start">
    <h1>NEON RACERS</h1>
    <div class="sub">Classic brick racing • Modern look</div>
    <div class="info">
      Swipe left / right to change lane<br>
      Dodge the oncoming cars<br>
      10 levels • Speed increases each level
    </div>
    <button class="btn" id="go">START RACE</button>
  </div>
  
  <div id="over" style="display:none">
    <h1 id="overTitle">CRASHED</h1>
    <div class="score-big" id="final">0</div>
    <div style="opacity:0.6;font-size:14px">Best: <span id="finalBest">0</span></div>
    <button class="btn" id="retry">RACE AGAIN</button>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, laneW, roadLeft, roadRight;
const LANES = 3;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const roadWidth = Math.min(W * 0.78, 340);
  roadLeft = (W - roadWidth) / 2;
  roadRight = roadLeft + roadWidth;
  laneW = roadWidth / LANES;
}
resize();
window.addEventListener('resize', resize);

// ===== AUDIO =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, type, dur, vol = 0.07) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}

function sfxMove() {
  tone(380, 'square', 0.05, 0.035);
}
function sfxScore() {
  tone(520, 'sine', 0.07, 0.05);
}
function sfxLevel() {
  tone(400, 'sine', 0.1, 0.06);
  setTimeout(() => tone(560, 'sine', 0.12, 0.05), 80);
  setTimeout(() => tone(720, 'sine', 0.15, 0.04), 160);
}
function sfxCrash() {
  tone(120, 'sawtooth', 0.3, 0.1);
  setTimeout(() => tone(80, 'sawtooth', 0.4, 0.08), 60);
}
function sfxWin() {
  [523, 659, 784, 1046].forEach((f, i) => {
    setTimeout(() => tone(f, 'sine', 0.2, 0.06), i * 120);
  });
}

// ===== STATE =====
let score = 0;
let level = 1;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('neonRacersBest') || '0'); } catch(e){}
document.getElementById('best').textContent = highScore;

let gameActive = false;
let baseSpeed = 4.0;
let speed = 4.0;
let spawnTimer = 0;
let shake = 0;
let levelScores = [0, 8, 18, 30, 45, 62, 82, 105, 130, 160]; // score needed to reach level 1-10

const player = {
  lane: 1,
  targetLane: 1,
  y: 0,
  color: '#00f2fe'
};

const cars = [];
const particles = [];
const lines = [];

function initLines() {
  lines.length = 0;
  for (let i = 0; i < 12; i++) lines.push({ y: i * 80 });
}
initLines();

// ===== DRAWING =====
function drawCar(x, y, color, isPlayer = false) {
  ctx.save();
  ctx.translate(x, y);

  const w = 42, h = 68;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, h/2 + 6, w*0.55, 8, 0, 0, Math.PI*2);
  ctx.fill();

  const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, shade(color, -28));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, shade(color, -28));

  roundRect(-w/2, -h/2, w, h, 8);
  ctx.fillStyle = grad;
  ctx.fill();

  // roof
  ctx.fillStyle = shade(color, -42);
  roundRect(-w/2 + 6, -h/2 + 14, w - 12, 26, 5);
  ctx.fill();

  // glass
  const glass = ctx.createLinearGradient(0, -h/2 + 14, 0, -h/2 + 30);
  glass.addColorStop(0, 'rgba(180,230,255,0.7)');
  glass.addColorStop(1, 'rgba(100,180,255,0.35)');
  ctx.fillStyle = glass;
  roundRect(-w/2 + 8, -h/2 + 16, w - 16, 14, 3);
  ctx.fill();

  ctx.fillStyle = 'rgba(100,160,220,0.4)';
  roundRect(-w/2 + 8, h/2 - 28, w - 16, 12, 3);
  ctx.fill();

  if (isPlayer) {
    ctx.fillStyle = '#fff9c4';
    ctx.shadowColor = '#fff59d';
    ctx.shadowBlur = 12;
    roundRect(-w/2 + 5, -h/2 + 2, 10, 6, 2);
    roundRect(w/2 - 15, -h/2 + 2, 10, 6, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#ff5252';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 10;
    roundRect(-w/2 + 5, h/2 - 8, 10, 5, 2);
    roundRect(w/2 - 15, h/2 - 8, 10, 5, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = shade(color, -15);
  ctx.fillRect(-w/2 - 5, -8, 6, 5);
  ctx.fillRect(w/2 - 1, -8, 6, 5);

  ctx.fillStyle = '#111';
  ctx.fillRect(-w/2 - 2, -h/2 + 12, 5, 14);
  ctx.fillRect(w/2 - 3, -h/2 + 12, 5, 14);
  ctx.fillRect(-w/2 - 2, h/2 - 26, 5, 14);
  ctx.fillRect(w/2 - 3, h/2 - 26, 5, 14);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(-2, -h/2 + 8, 4, h - 16);

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function shade(col, p) {
  const n = parseInt(col.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + p));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + p));
  const b = Math.min(255, Math.max(0, (n & 0xff) + p));
  return `rgb(${r},${g},${b})`;
}

function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
      life: 1, color, size: 2 + Math.random()*3
    });
  }
}

const ENEMY_COLORS = ['#ff4757', '#ffa502', '#2ed573', '#a55eea', '#ff6b81', '#eccc68', '#18dcff'];

function spawnCar() {
  let lane;
  do {
    lane = Math.floor(Math.random() * LANES);
  } while (cars.length && cars[cars.length-1].lane === lane && Math.random() < 0.55);

  cars.push({
    lane,
    y: -80,
    color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)],
    passed: false
  });
}

function laneX(lane) {
  return roadLeft + laneW * lane + laneW / 2;
}

function showLevelUp() {
  const el = document.getElementById('levelup');
  el.textContent = level >= 10 ? 'FINAL LEVEL' : 'LEVEL ' + level;
  el.style.opacity = '1';
  clearTimeout(window._lu);
  window._lu = setTimeout(() => el.style.opacity = '0', 900);
  sfxLevel();
}

function checkLevel() {
  if (level >= 10) return;
  if (score >= levelScores[level]) {
    level++;
    document.getElementById('level').textContent = level;
    // speed jump per level
    baseSpeed = 4.0 + (level - 1) * 0.85;
    speed = baseSpeed;
    showLevelUp();
  }
}

function update(dt) {
  speed = baseSpeed + Math.min(score * 0.008, 2.5);

  // smooth lane
  player.lane += (player.targetLane - player.lane) * 0.22;
  player.y = H - 120;

  lines.forEach(l => {
    l.y += speed * 1.85;
    if (l.y > H + 40) l.y -= 12 * 80;
  });

  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.y += speed;

    if (!c.passed && c.y > player.y + 40) {
      c.passed = true;
      score++;
      document.getElementById('score').textContent = score;
      sfxScore();
      checkLevel();
    }

    const px = laneX(player.lane);
    if (Math.abs(c.lane - player.lane) < 0.42 && Math.abs(c.y - player.y) < 56) {
      burst(px, player.y, '#ff5252', 26);
      burst(px, player.y, '#fff', 10);
      shake = 15;
      sfxCrash();
      endGame(false);
      return;
    }

    if (c.y > H + 100) cars.splice(i, 1);
  }

  spawnTimer += dt;
  // faster spawn on higher levels
  const interval = Math.max(0.42, 1.25 - (level - 1) * 0.08 - score * 0.004);
  if (spawnTimer > interval) {
    spawnCar();
    if (level >= 5 && Math.random() < 0.22) spawnCar();
    if (level >= 8 && Math.random() < 0.15) spawnCar();
    spawnTimer = 0;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12;
    p.life -= 0.022;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Win condition
  if (level >= 10 && score >= 200) {
    endGame(true);
  }
}

function draw() {
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);

  // road
  ctx.fillStyle = '#141420';
  ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

  // edges
  ctx.strokeStyle = '#00f2fe';
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.65;
  ctx.beginPath();
  ctx.moveTo(roadLeft, 0); ctx.lineTo(roadLeft, H);
  ctx.moveTo(roadRight, 0); ctx.lineTo(roadRight, H);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // lane lines
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 3;
  ctx.setLineDash([18, 22]);
  for (let i = 1; i < LANES; i++) {
    const x = roadLeft + laneW * i;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // moving dashes
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  lines.forEach(l => {
    for (let i = 1; i < LANES; i++) {
      ctx.fillRect(roadLeft + laneW * i - 2, l.y, 4, 28);
    }
  });

  // side glow
  const g1 = ctx.createLinearGradient(roadLeft - 40, 0, roadLeft, 0);
  g1.addColorStop(0, 'transparent');
  g1.addColorStop(1, 'rgba(0,242,254,0.07)');
  ctx.fillStyle = g1;
  ctx.fillRect(roadLeft - 40, 0, 40, H);
  const g2 = ctx.createLinearGradient(roadRight, 0, roadRight + 40, 0);
  g2.addColorStop(0, 'rgba(0,242,254,0.07)');
  g2.addColorStop(1, 'transparent');
  ctx.fillStyle = g2;
  ctx.fillRect(roadRight, 0, 40, H);

  cars.forEach(c => drawCar(laneX(c.lane), c.y, c.color, false));
  drawCar(laneX(player.lane), player.y, player.color, true);

  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (speed > 7.5) {
    ctx.strokeStyle = 'rgba(0,242,254,0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) {
      const x = roadLeft + Math.random() * (roadRight - roadLeft);
      const y = Math.random() * H;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 18 + speed * 2);
      ctx.stroke();
    }
  }
}

let last = 0;
function loop(ts) {
  if (!gameActive) return;
  const dt = Math.min((ts - last) / 1000, 0.05) || 0.016;
  last = ts;

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.88;
  }
  update(dt);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}

function changeLane(dir) {
  if (!gameActive) return;
  const next = Math.max(0, Math.min(LANES - 1, player.targetLane + dir));
  if (next !== player.targetLane) {
    player.targetLane = next;
    sfxMove();
  }
}

// Controls
let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  touchX = e.touches[0].clientX;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 28) changeLane(dx > 0 ? 1 : -1);
  touchX = null;
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') changeLane(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') changeLane(1);
});

canvas.addEventListener('click', e => {
  if (!gameActive) return;
  changeLane(e.clientX < W / 2 ? -1 : 1);
});

function startGame() {
  initAudio();
  document.getElementById('start').style.display = 'none';
  document.getElementById('over').style.display = 'none';
  gameActive = true;
  score = 0;
  level = 1;
  baseSpeed = 4.0;
  speed = 4.0;
  spawnTimer = 0;
  cars.length = 0;
  particles.length = 0;
  player.lane = 1;
  player.targetLane = 1;
  document.getElementById('score').textContent = '0';
  document.getElementById('level').textContent = '1';
  initLines();
  last = performance.now();
  requestAnimationFrame(loop);
}

function endGame(won) {
  gameActive = false;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('neonRacersBest', highScore); } catch(e){}
  }
  document.getElementById('final').textContent = score;
  document.getElementById('finalBest').textContent = highScore;
  document.getElementById('best').textContent = highScore;
  document.getElementById('overTitle').textContent = won ? 'YOU WIN!' : 'CRASHED';
  if (won) sfxWin();
  setTimeout(() => {
    document.getElementById('over').style.display = 'flex';
  }, 350);
}

document.getElementById('go').addEventListener('click', startGame);
document.getElementById('retry').addEventListener('click', () => {
  document.getElementById('over').style.display = 'none';
  startGame();
});
</script>
</body>
</html>
